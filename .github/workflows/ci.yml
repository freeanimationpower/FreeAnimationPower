name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          modules: 'qtmultimedia'

      - name: Configure CMake
        # Qt 6.5.3 headers use stdext::make_*_array_iterator without including
        # <iterator>; newer MSVC toolchains no longer pull it in transitively.
        # Force-include the guarded shim (safe for C sources like miniz).
        run: cmake -B build "-DCMAKE_CXX_FLAGS=/FI${{ github.workspace }}/ci/msvc_qt65_compat.h"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure
