name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          modules: 'qtmultimedia'

      - name: Configure CMake
        # Qt 6.5.3 headers call stdext::make_*_array_iterator (qcompilerdetection.h)
        # without including <iterator>. Newer MSVC (VS2022 17.13+/VS2026) no longer
        # pulls <iterator> in transitively, breaking compilation. Force-include it.
        run: cmake -B build -DCMAKE_CXX_FLAGS="/FIiterator"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure
